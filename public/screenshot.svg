<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg)"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="360" height="80" rx="20" fill="rgba(255,255,255,0.95)" stroke="white" stroke-width="2"/>
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#667eea">🎯 ScraBBly</text>
  <text x="200" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Word scramble puzzle game</text>
  
  <!-- Game Area -->
  <rect x="40" y="120" width="320" height="280" rx="16" fill="rgba(255,255,255,0.95)" stroke="white" stroke-width="2"/>
  
  <!-- Letters Circle -->
  <circle cx="200" cy="260" r="80" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="2"/>
  
  <!-- Letter tiles -->
  <circle cx="140" cy="200" r="20" fill="#667eea" stroke="white" stroke-width="2"/>
  <text x="140" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">S</text>
  
  <circle cx="260" cy="200" r="20" fill="#667eea" stroke="white" stroke-width="2"/>
  <text x="260" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">C</text>
  
  <circle cx="170" cy="240" r="20" fill="#667eea" stroke="white" stroke-width="2"/>
  <text x="170" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">R</text>
  
  <circle cx="230" cy="240" r="20" fill="#667eea" stroke="white" stroke-width="2"/>
  <text x="230" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">A</text>
  
  <circle cx="140" cy="280" r="20" fill="#667eea" stroke="white" stroke-width="2"/>
  <text x="140" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">B</text>
  
  <circle cx="260" cy="280" r="20" fill="#667eea" stroke="white" stroke-width="2"/>
  <text x="260" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">B</text>
  
  <circle cx="200" cy="320" r="20" fill="#667eea" stroke="white" stroke-width="2"/>
  <text x="200" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">L</text>
  
  <!-- Score -->
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#667eea">Current Score: 42</text>
  
  <!-- Input Area -->
  <rect x="80" y="420" width="160" height="40" rx="8" fill="white" stroke="#667eea" stroke-width="2"/>
  <text x="160" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Enter your word...</text>
  
  <!-- Button -->
  <rect x="260" y="420" width="80" height="40" rx="8" fill="#667eea"/>
  <text x="300" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Submit</text>
  
  <!-- Features -->
  <rect x="20" y="480" width="360" height="100" rx="12" fill="rgba(255,255,255,0.1)"/>
  <text x="200" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Features</text>
  <text x="200" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• 7-10 letter word puzzles</text>
  <text x="200" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• Live leaderboards</text>
  <text x="200" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">• Real-time scoring</text>
</svg>
