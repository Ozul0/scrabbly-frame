<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 ScraBBly - Farcaster Mini App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .game-container {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            font-size: 2.5em;
            margin: 0 0 20px 0;
            font-weight: 300;
        }
        .letters-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
            padding: 20px;
            background: #000000;
            border: 1px solid #333333;
            border-radius: 8px;
        }
        .letter {
            width: 40px;
            height: 40px;
            background: #ffffff;
            color: #000000;
            border: 1px solid #333333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
        }
        .input-section {
            margin: 20px 0;
        }
        .word-input {
            padding: 12px 16px;
            border: 1px solid #333333;
            border-radius: 4px;
            font-size: 16px;
            width: 200px;
            margin-right: 10px;
            background: #1a1a1a;
            color: #ffffff;
        }
        .btn {
            background: #ffffff;
            color: #000000;
            border: 1px solid #333333;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin: 4px;
        }
        .btn:hover {
            background: #f0f0f0;
        }
        .score {
            font-size: 18px;
            font-weight: 500;
            margin: 16px 0;
            color: #ffffff;
        }
        .message {
            margin: 12px 0;
            padding: 12px;
            border-radius: 4px;
            font-weight: 500;
        }
        .success { background: #ffffff; color: #000000; border: 1px solid #333333; }
        .error { background: #000000; color: #ffffff; border: 1px solid #333333; }
        .info { background: #1a1a1a; color: #ffffff; border: 1px solid #333333; }
        .found-words {
            margin: 12px 0;
            padding: 12px;
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 4px;
            font-weight: 500;
        }
        .leaderboard-section {
            margin-top: 20px;
            padding: 15px;
            background: #000000;
            border: 1px solid #333333;
            border-radius: 4px;
        }
        .leaderboard-section h3 {
            color: #ffffff;
            margin: 0 0 10px 0;
            font-weight: 500;
        }
        .game-info {
            margin-top: 15px;
            color: #666666;
            font-size: 14px;
        }
        .game-info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 ScraBBly</h1>
        <p>Word scramble game! Find words from 7-10 scrambled letters.</p>
        
        <div class="letters-container" id="letters-container">
            <!-- Letters will be generated here -->
        </div>
        
        <div class="score" id="score">Current Score: 0</div>
        
        <div class="input-section">
            <input type="text" id="word-input" class="word-input" placeholder="Enter your word..." onkeypress="handleKeyPress(event)">
            <button class="btn" onclick="submitWord()">Submit Word</button>
        </div>
        
        <div id="message" class="message" style="display: none;"></div>
        <div id="found-words" class="found-words" style="display: none;"></div>
        
        <button class="btn" onclick="newGame()">New Game</button>
        
        <div class="leaderboard-section">
            <h3>Leaderboards</h3>
            <button class="btn" onclick="window.open('https://scrabbly-frame.vercel.app/api/weekly-leaderboard-frame', '_blank')">Weekly Top 50</button>
            <button class="btn" onclick="window.open('https://scrabbly-frame.vercel.app/api/alltime-leaderboard-frame', '_blank')">All-Time Top 1000</button>
        </div>
        
        <div class="game-info">
            <p><strong>ScraBBly</strong> - Word scramble game for Farcaster</p>
            <p>Find words from 7-10 scrambled letters. Find the main word to advance!</p>
        </div>
    </div>

    <script src="https://unpkg.com/@farcaster/mini-apps-sdk@latest/dist/miniapp.js"></script>
    <script>
        // Initialize Farcaster Mini App SDK
        const sdk = window.miniApp;
        
        // Call ready() to dismiss splash screen
        sdk.actions.ready();
        
        let currentPuzzle = null;
        let foundWords = [];
        let currentScore = 0;

        // Simple word validation (you can expand this)
        const commonWords = [
            'CAT', 'DOG', 'SUN', 'MOON', 'STAR', 'TREE', 'WATER', 'HOUSE', 'CAR',
            'BOOK', 'BIRD', 'FISH', 'GAME', 'PLAY', 'WORK', 'LOVE', 'HAPPY',
            'SMALL', 'LARGE', 'HAPPY', 'QUICK', 'BROWN', 'GREEN', 'BLUE',
            'PICTURE', 'STUDENT', 'TEACHER', 'WINTERS', 'SUMMERS', 'FLOWERS',
            'FRIENDS', 'HAPPILY', 'QUICKLY', 'BEAUTIFUL', 'HEALTHY', 'WEATHER',
            'MORNING', 'VACATION', 'HOLIDAY', 'BIRTHDAY', 'WEEKEND', 'PURPOSE',
            'COUNTRY', 'FUTURE', 'PRESENT', 'PASSION', 'FASHION', 'MISSION'
        ];

        function generateNewPuzzle() {
            const words = [
                'PICTURE', 'STUDENT', 'TEACHER', 'WINTERS', 'SUMMERS', 'FLOWERS',
                'BEAUTIFUL', 'HEALTHY', 'WEATHER', 'MORNING', 'VACATION', 'HOLIDAY',
                'BIRTHDAY', 'WEEKEND', 'PURPOSE', 'COUNTRY', 'FUTURE', 'PRESENT',
                'PASSION', 'FASHION', 'MISSION', 'VERSION', 'SERVICE', 'PARKING',
                'RUNNING', 'SINGING', 'DANCING', 'SWIMMING', 'COOKING', 'READING',
                'WRITING', 'DRIVING', 'WORKING', 'LEARNING', 'TEACHING', 'HELPING',
                'SHARING', 'CARING', 'LOVING', 'LIVING', 'GIVING', 'TAKING',
                'MAKING', 'BREAKING', 'CREATING', 'DESIGNING', 'BUILDING', 'PLANNING'
            ];
            
            const targetWord = words[Math.floor(Math.random() * words.length)];
            const shuffledLetters = targetWord.split('').sort(() => Math.random() - 0.5);
            
            currentPuzzle = {
                targetWord,
                letters: shuffledLetters
            };
            
            console.log('Generated puzzle:', currentPuzzle); // Debug log
            displayLetters();
            clearMessage();
        }

        function displayLetters() {
            const container = document.getElementById('letters-container');
            container.innerHTML = '';
            
            console.log('Displaying letters:', currentPuzzle.letters); // Debug log
            
            currentPuzzle.letters.forEach(letter => {
                const letterDiv = document.createElement('div');
                letterDiv.className = 'letter';
                letterDiv.textContent = letter;
                container.appendChild(letterDiv);
            });
        }

        function submitWord() {
            const input = document.getElementById('word-input');
            const word = input.value.trim().toUpperCase();
            
            if (!word) {
                showMessage('Please enter a word!', 'error');
                return;
            }
            
            if (canMakeWord(word)) {
                if (commonWords.includes(word)) {
                    const score = calculateScore(word);
                    currentScore += score;
                    foundWords.push(word);
                    
                    if (word === currentPuzzle.targetWord) {
                        showMessage(`🎉 Perfect! You found "${word}"! +${score} points`, 'success');
                        setTimeout(() => {
                            newGame();
                        }, 2000);
                    } else {
                        showMessage(`Great! "${word}" earned ${score} points!`, 'success');
                    }
                    
                    updateScore();
                    updateFoundWords();
                } else {
                    showMessage(`"${word}" is not a valid word`, 'error');
                }
            } else {
                showMessage(`"${word}" cannot be made from these letters`, 'error');
            }
            
            input.value = '';
        }

        function canMakeWord(word) {
            const availableLetters = [...currentPuzzle.letters];
            
            for (const letter of word) {
                const index = availableLetters.indexOf(letter);
                if (index === -1) return false;
                availableLetters.splice(index, 1);
            }
            
            return true;
        }

        function calculateScore(word) {
            let score = word.length;
            if (word.length >= 5) score *= 2;
            if (word.length === currentPuzzle.targetWord.length) score *= 3;
            return score;
        }

        function newGame() {
            currentScore = 0;
            foundWords = [];
            generateNewPuzzle();
            updateScore();
            updateFoundWords();
        }

        function updateScore() {
            document.getElementById('score').textContent = `Current Score: ${currentScore}`;
        }

        function updateFoundWords() {
            const foundWordsDiv = document.getElementById('found-words');
            if (foundWords.length > 0) {
                foundWordsDiv.textContent = `Found: ${foundWords.join(', ')}`;
                foundWordsDiv.style.display = 'block';
            } else {
                foundWordsDiv.style.display = 'none';
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        function clearMessage() {
            document.getElementById('message').style.display = 'none';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                submitWord();
            }
        }

        // Start the game
        newGame();
    </script>
</body>
</html>
