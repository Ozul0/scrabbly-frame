<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 ScraBBly - Farcaster Mini App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .game-container {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            font-size: 2.5em;
            margin: 0 0 20px 0;
            font-weight: 300;
        }
        .letters-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
            padding: 20px;
            background: #000000;
            border: 1px solid #333333;
            border-radius: 8px;
        }
        .letter {
            width: 40px;
            height: 40px;
            background: #ffffff;
            color: #000000;
            border: 2px solid #666666;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin: 2px;
        }
        .input-section {
            margin: 20px 0;
        }
        .word-input {
            padding: 12px 16px;
            border: 1px solid #333333;
            border-radius: 4px;
            font-size: 16px;
            width: 200px;
            margin-right: 10px;
            background: #1a1a1a;
            color: #ffffff;
        }
        .btn {
            background: #ffffff;
            color: #000000;
            border: 1px solid #333333;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin: 4px;
        }
        .btn:hover {
            background: #f0f0f0;
        }
        .score {
            font-size: 18px;
            font-weight: 500;
            margin: 16px 0;
            color: #ffffff;
        }
        .message {
            margin: 12px 0;
            padding: 12px;
            border-radius: 4px;
            font-weight: 500;
        }
        .success { background: #ffffff; color: #000000; border: 1px solid #333333; }
        .error { background: #000000; color: #ffffff; border: 1px solid #333333; }
        .info { background: #1a1a1a; color: #ffffff; border: 1px solid #333333; }
        .found-words {
            margin: 12px 0;
            padding: 12px;
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 4px;
            font-weight: 500;
        }
        .leaderboard-section {
            margin-top: 20px;
            padding: 15px;
            background: #000000;
            border: 1px solid #333333;
            border-radius: 4px;
        }
        .leaderboard-section h3 {
            color: #ffffff;
            margin: 0 0 10px 0;
            font-weight: 500;
        }
        .game-info {
            margin-top: 15px;
            color: #666666;
            font-size: 14px;
        }
        .game-info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="font-size: 48px; margin-bottom: 10px;">🎯</div>
            <h1>ScraBBly</h1>
            <p>Word scramble game! Find words from 7-10 scrambled letters.</p>
        </div>
        
        <div style="margin-bottom: 20px;">
            <button class="btn" onclick="startGame()" style="font-size: 20px; padding: 20px 40px; background: #ffffff; color: #000000; border: 2px solid #333333; font-weight: bold;">🎮 PLAY SCRABBLY</button>
        </div>
        
        <div id="loading-indicator" style="display: none; color: #666666; font-size: 14px; margin: 10px 0;">
            Loading game...
        </div>
        
        <div class="letters-container" id="letters-container" style="display: none;">
            <!-- Letters will be generated here -->
        </div>
        
        <div class="score" id="score" style="display: none;">Current Score: 0</div>
        
        <div class="input-section" id="input-section" style="display: none;">
            <input type="text" id="word-input" class="word-input" placeholder="Enter your word..." onkeypress="handleKeyPress(event)">
            <button class="btn" onclick="submitWord()">Submit Word</button>
        </div>
        
        <div id="message" class="message" style="display: none;"></div>
        <div id="found-words" class="found-words" style="display: none;"></div>
        
        <div id="game-controls" style="display: none;">
            <button class="btn" onclick="newGame()">New Game</button>
            <button class="btn" onclick="showHint()">💡 Hint</button>
        </div>
        
        <div class="leaderboard-section">
            <h3>Leaderboards</h3>
            <button class="btn" onclick="window.open('https://scrabbly-frame.vercel.app/api/weekly-leaderboard-frame', '_blank')">Weekly Top 50</button>
            <button class="btn" onclick="window.open('https://scrabbly-frame.vercel.app/api/alltime-leaderboard-frame', '_blank')">All-Time Top 1000</button>
        </div>
        
        <div class="game-info">
            <p><strong>ScraBBly</strong> - Word scramble game for Farcaster</p>
            <p>Find words from 7-10 scrambled letters. Find the main word to advance!</p>
        </div>
    </div>

            try {
                // Try multiple methods to dismiss splash
                if (window.miniApp) {
                    if (window.miniApp.actions && window.miniApp.actions.ready) {
                        window.miniApp.actions.ready();
                    }
                    if (window.miniApp.ready) {
                        window.miniApp.ready();
                    }
                    if (window.miniApp.dismissSplash) {
                        window.miniApp.dismissSplash();
                    }
                    if (window.miniApp.hideSplash) {
                        window.miniApp.hideSplash();
                    }
                }
                
                // Try direct calls
                if (window.miniAppReady) {
                    window.miniAppReady();
                }
                if (window.dismissSplash) {
                    window.dismissSplash();
                }
                
                console.log('Splash dismissal attempted');
            } catch (error) {
                console.error('Error dismissing splash:', error);
            }
        }

        dismissSplash();

        function showHint() {
            if (!currentPuzzle || !currentPuzzle.targetWord) {
                showMessage('No puzzle available!', 'error');
                return;
            }
            
            const targetWord = currentPuzzle.targetWord;
            const hint = wordHints[targetWord] || `A ${targetWord.length}-letter word`;
            
            showMessage(`💡 Hint: ${hint}`, 'info');
        }

        function generateNewPuzzle() {
            const words = [
                'PICTURE', 'STUDENT', 'TEACHER', 'WINTERS', 'SUMMERS', 'FLOWERS',
                'BEAUTIFUL', 'HEALTHY', 'WEATHER', 'MORNING', 'VACATION', 'HOLIDAY',
                'BIRTHDAY', 'WEEKEND', 'PURPOSE', 'COUNTRY', 'FUTURE', 'PRESENT',
                'PASSION', 'FASHION', 'MISSION', 'VERSION', 'SERVICE', 'PARKING',
                'RUNNING', 'SINGING', 'DANCING', 'SWIMMING', 'COOKING', 'READING',
                'WRITING', 'DRIVING', 'WORKING', 'LEARNING', 'TEACHING', 'HELPING',
                'SHARING', 'CARING', 'LOVING', 'LIVING', 'GIVING', 'TAKING',
                'MAKING', 'BREAKING', 'CREATING', 'DESIGNING', 'BUILDING', 'PLANNING'
            ];
            
            const targetWord = words[Math.floor(Math.random() * words.length)];
            const shuffledLetters = targetWord.split('').sort(() => Math.random() - 0.5);
            
            currentPuzzle = {
                targetWord,
                letters: shuffledLetters
            };
            
            console.log('Generated puzzle:', currentPuzzle); // Debug log
            displayLetters();
            clearMessage();
        }

        function displayLetters() {
            const container = document.getElementById('letters-container');
            container.innerHTML = '';
            
            console.log('Displaying letters:', currentPuzzle.letters); // Debug log
            
            if (!currentPuzzle || !currentPuzzle.letters) {
                console.error('No puzzle or letters found!');
                return;
            }
            
            currentPuzzle.letters.forEach(letter => {
                const letterDiv = document.createElement('div');
                letterDiv.className = 'letter';
                letterDiv.textContent = letter;
                letterDiv.style.background = '#ffffff';
                letterDiv.style.color = '#000000';
                letterDiv.style.border = '2px solid #666666';
                letterDiv.style.fontSize = '20px';
                letterDiv.style.fontWeight = 'bold';
                container.appendChild(letterDiv);
            });
        }

        function submitWord() {
            const input = document.getElementById('word-input');
            const word = input.value.trim().toUpperCase();
            
            if (!word) {
                showMessage('Please enter a word!', 'error');
                return;
            }
            
            if (canMakeWord(word)) {
                if (commonWords.includes(word)) {
                    const score = calculateScore(word);
                    currentScore += score;
                    foundWords.push(word);
                    
                    if (word === currentPuzzle.targetWord) {
                        showMessage(`🎉 Perfect! You found "${word}"! +${score} points`, 'success');
                        setTimeout(() => {
                            newGame();
                        }, 2000);
                    } else {
                        showMessage(`Great! "${word}" earned ${score} points!`, 'success');
                    }
                    
                    updateScore();
                    updateFoundWords();
                } else {
                    showMessage(`"${word}" is not a valid word`, 'error');
                }
            } else {
                showMessage(`"${word}" cannot be made from these letters`, 'error');
            }
            
            input.value = '';
        }

        function canMakeWord(word) {
            const availableLetters = [...currentPuzzle.letters];
            
            for (const letter of word) {
                const index = availableLetters.indexOf(letter);
                if (index === -1) return false;
                availableLetters.splice(index, 1);
            }
            
            return true;
        }

        function calculateScore(word) {
            let score = word.length;
            if (word.length >= 5) score *= 2;
            if (word.length === currentPuzzle.targetWord.length) score *= 3;
            return score;
        }

        function newGame() {
            currentScore = 0;
            foundWords = [];
            generateNewPuzzle();
            updateScore();
            updateFoundWords();
        }

        function updateScore() {
            document.getElementById('score').textContent = `Current Score: ${currentScore}`;
        }

        function updateFoundWords() {
            const foundWordsDiv = document.getElementById('found-words');
            if (foundWords.length > 0) {
                foundWordsDiv.textContent = `Found: ${foundWords.join(', ')}`;
                foundWordsDiv.style.display = 'block';
            } else {
                foundWordsDiv.style.display = 'none';
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        function clearMessage() {
            document.getElementById('message').style.display = 'none';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                submitWord();
            }
        }

        // Function to start the game
        function startGame() {
            // Hide the play button and show game elements
            document.querySelector('button[onclick="startGame()"]').style.display = 'none';
            document.getElementById('letters-container').style.display = 'flex';
            document.getElementById('score').style.display = 'block';
            document.getElementById('input-section').style.display = 'block';
            document.getElementById('game-controls').style.display = 'block';
            
            // Start the actual game
            newGame();
        }
        
        // Auto-start game after 3 seconds if splash screen persists
        setTimeout(function() {
            if (document.querySelector('button[onclick="startGame()"]').style.display !== 'none') {
                console.log('Auto-starting game due to splash screen persistence');
                startGame();
            }
        }, 3000);
        
        // Also try to dismiss splash on any user interaction
        document.addEventListener('click', function() {
            dismissSplash();
        });
        
        document.addEventListener('touchstart', function() {
            dismissSplash();
        });
    </script>
</body>
</html>
