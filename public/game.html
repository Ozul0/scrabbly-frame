<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 ScraBBly - Farcaster Mini App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-container {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5em;
            margin: 0 0 20px 0;
        }
        .letters-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 16px;
        }
        .letter {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .input-section {
            margin: 20px 0;
        }
        .word-input {
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            width: 200px;
            margin-right: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }
        .score {
            font-size: 20px;
            font-weight: 700;
            margin: 16px 0;
            color: #667eea;
        }
        .message {
            margin: 12px 0;
            padding: 12px;
            border-radius: 12px;
            font-weight: 500;
        }
        .success { background: linear-gradient(135deg, #28a745, #20c997); color: white; }
        .error { background: linear-gradient(135deg, #dc3545, #c82333); color: white; }
        .info { background: linear-gradient(135deg, #17a2b8, #138496); color: white; }
        .found-words {
            margin: 12px 0;
            padding: 12px;
            background: linear-gradient(135deg, #e8f5e8, #d4edda);
            color: #155724;
            border-radius: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 ScraBBly</h1>
        <p>Word scramble game! Find words from 7-10 scrambled letters.</p>
        
        <div class="letters-container" id="letters-container">
            <!-- Letters will be generated here -->
        </div>
        
        <div class="score" id="score">Current Score: 0</div>
        
        <div class="input-section">
            <input type="text" id="word-input" class="word-input" placeholder="Enter your word..." onkeypress="handleKeyPress(event)">
            <button class="btn" onclick="submitWord()">Submit Word</button>
        </div>
        
        <div id="message" class="message" style="display: none;"></div>
        <div id="found-words" class="found-words" style="display: none;"></div>
        
        <button class="btn" onclick="newGame()">New Game</button>
        
        <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 12px;">
            <h3 style="color: white; margin: 0 0 10px 0;">🏆 Leaderboards</h3>
            <button class="btn" onclick="window.open('https://scrabbly-frame.vercel.app/api/weekly-leaderboard-frame', '_blank')" style="margin: 5px;">📅 Weekly Top 50</button>
            <button class="btn" onclick="window.open('https://scrabbly-frame.vercel.app/api/alltime-leaderboard-frame', '_blank')" style="margin: 5px;">👑 All-Time Top 1000</button>
        </div>
        
        <div style="margin-top: 15px; color: rgba(255,255,255,0.8); font-size: 14px;">
            <p>🎯 <strong>ScraBBly</strong> - Word scramble game for Farcaster</p>
            <p>Find words from 7-10 scrambled letters. Find the main word to advance!</p>
        </div>
    </div>

    <script src="https://unpkg.com/@farcaster/mini-apps-sdk@latest/dist/miniapp.js"></script>
    <script>
        // Initialize Farcaster Mini App SDK
        const sdk = window.miniApp;
        
        // Call ready() to dismiss splash screen
        sdk.actions.ready();
        
        let currentPuzzle = null;
        let foundWords = [];
        let currentScore = 0;

        // Simple word validation (you can expand this)
        const commonWords = [
            'CAT', 'DOG', 'SUN', 'MOON', 'STAR', 'TREE', 'WATER', 'HOUSE', 'CAR',
            'BOOK', 'BIRD', 'FISH', 'GAME', 'PLAY', 'WORK', 'LOVE', 'HAPPY',
            'SMALL', 'LARGE', 'HAPPY', 'QUICK', 'BROWN', 'GREEN', 'BLUE',
            'PICTURE', 'STUDENT', 'TEACHER', 'WINTERS', 'SUMMERS', 'FLOWERS',
            'FRIENDS', 'HAPPILY', 'QUICKLY', 'BEAUTIFUL', 'HEALTHY', 'WEATHER',
            'MORNING', 'VACATION', 'HOLIDAY', 'BIRTHDAY', 'WEEKEND', 'PURPOSE',
            'COUNTRY', 'FUTURE', 'PRESENT', 'PASSION', 'FASHION', 'MISSION'
        ];

        function generateNewPuzzle() {
            const words = [
                'PICTURE', 'STUDENT', 'TEACHER', 'WINTERS', 'SUMMERS', 'FLOWERS',
                'BEAUTIFUL', 'HEALTHY', 'WEATHER', 'MORNING', 'VACATION', 'HOLIDAY',
                'BIRTHDAY', 'WEEKEND', 'PURPOSE', 'COUNTRY', 'FUTURE', 'PRESENT',
                'PASSION', 'FASHION', 'MISSION', 'VERSION', 'SERVICE', 'PARKING',
                'RUNNING', 'SINGING', 'DANCING', 'SWIMMING', 'COOKING', 'READING',
                'WRITING', 'DRIVING', 'WORKING', 'LEARNING', 'TEACHING', 'HELPING',
                'SHARING', 'CARING', 'LOVING', 'LIVING', 'GIVING', 'TAKING',
                'MAKING', 'BREAKING', 'CREATING', 'DESIGNING', 'BUILDING', 'PLANNING'
            ];
            
            const targetWord = words[Math.floor(Math.random() * words.length)];
            const shuffledLetters = targetWord.split('').sort(() => Math.random() - 0.5);
            
            currentPuzzle = {
                targetWord,
                letters: shuffledLetters
            };
            
            displayLetters();
            clearMessage();
        }

        function displayLetters() {
            const container = document.getElementById('letters-container');
            container.innerHTML = '';
            
            currentPuzzle.letters.forEach(letter => {
                const letterDiv = document.createElement('div');
                letterDiv.className = 'letter';
                letterDiv.textContent = letter;
                container.appendChild(letterDiv);
            });
        }

        function submitWord() {
            const input = document.getElementById('word-input');
            const word = input.value.trim().toUpperCase();
            
            if (!word) {
                showMessage('Please enter a word!', 'error');
                return;
            }
            
            if (canMakeWord(word)) {
                if (commonWords.includes(word)) {
                    const score = calculateScore(word);
                    currentScore += score;
                    foundWords.push(word);
                    
                    if (word === currentPuzzle.targetWord) {
                        showMessage(`🎉 Perfect! You found "${word}"! +${score} points`, 'success');
                        setTimeout(() => {
                            newGame();
                        }, 2000);
                    } else {
                        showMessage(`Great! "${word}" earned ${score} points!`, 'success');
                    }
                    
                    updateScore();
                    updateFoundWords();
                } else {
                    showMessage(`"${word}" is not a valid word`, 'error');
                }
            } else {
                showMessage(`"${word}" cannot be made from these letters`, 'error');
            }
            
            input.value = '';
        }

        function canMakeWord(word) {
            const availableLetters = [...currentPuzzle.letters];
            
            for (const letter of word) {
                const index = availableLetters.indexOf(letter);
                if (index === -1) return false;
                availableLetters.splice(index, 1);
            }
            
            return true;
        }

        function calculateScore(word) {
            let score = word.length;
            if (word.length >= 5) score *= 2;
            if (word.length === currentPuzzle.targetWord.length) score *= 3;
            return score;
        }

        function newGame() {
            currentScore = 0;
            foundWords = [];
            generateNewPuzzle();
            updateScore();
            updateFoundWords();
        }

        function updateScore() {
            document.getElementById('score').textContent = `Current Score: ${currentScore}`;
        }

        function updateFoundWords() {
            const foundWordsDiv = document.getElementById('found-words');
            if (foundWords.length > 0) {
                foundWordsDiv.textContent = `Found: ${foundWords.join(', ')}`;
                foundWordsDiv.style.display = 'block';
            } else {
                foundWordsDiv.style.display = 'none';
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        function clearMessage() {
            document.getElementById('message').style.display = 'none';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                submitWord();
            }
        }

        // Start the game
        newGame();
    </script>
</body>
</html>
